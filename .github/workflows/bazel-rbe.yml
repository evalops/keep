name: Bazel RBE

on:
  pull_request:
    paths:
      - .bazelignore
      - .bazelrc
      - .bazelversion
      - .github/actionlint.yaml
      - .github/workflows/bazel-rbe.yml
      - BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
      - bazel/**
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - scripts/run-bazel-rbe.sh
  push:
    branches:
      - main
    paths:
      - .bazelignore
      - .bazelrc
      - .bazelversion
      - .github/actionlint.yaml
      - .github/workflows/bazel-rbe.yml
      - BUILD.bazel
      - MODULE.bazel
      - MODULE.bazel.lock
      - bazel/**
      - "**/*.go"
      - go.mod
      - go.sum
      - Makefile
      - scripts/run-bazel-rbe.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.BAZEL_RBE_ENABLED == 'true'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - evalops-keep-rbe
    timeout-minutes: 25
    env:
      BAZEL_RBE_USE_EXISTING_TUNNEL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Bazel tools
        env:
          GOFLAGS: -mod=mod
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          go install github.com/bazelbuild/buildtools/buildifier@latest

      - name: Verify generated Bazel graph
        run: make bazel-check

      - name: Run Buildfarm smoke tests
        run: make bazel-rbe-smoke
