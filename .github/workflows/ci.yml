name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: evalops/service-runtime/.github/actions/setup-go-service@ca09da8302203b96582332dbcababe9f2d906d10
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install lint and format tooling
        run: make install-format-tools install-lint-tools

      - name: Format check
        run: make ci-format-check

      - name: Lint
        run: make lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=20
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: app_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: evalops/service-runtime/.github/actions/setup-go-service@ca09da8302203b96582332dbcababe9f2d906d10
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python dependencies
        run: |
          uv pip install --system -r app/requirements.txt
          make install-opa

      - name: Wait for database
        run: |
          for attempt in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres -d app_test && exit 0
            echo "Waiting for Postgres ($attempt/30)..."
            sleep 1
          done
          echo "Postgres did not become ready" >&2
          exit 1

      - name: Run test suite
        run: make test

      - name: Test OPA policies
        run: make opa-test

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: evalops/service-runtime/.github/actions/setup-go-service@ca09da8302203b96582332dbcababe9f2d906d10
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Prepare tooling
        run: make install-security-tools

      - name: Run security checks
        run: make security

  build:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build authz service
        run: docker build -t keep/authz -f services/authz/Dockerfile .

      - name: Build inventory service  
        run: docker build -t keep/inventory -f services/inventory/Dockerfile .

      - name: Build Flask app
        run: docker build -t keep/app -f app/Dockerfile .

      - name: Test Docker Compose build
        run: docker compose -f docker-compose.secure.yml build

      - name: Run basic smoke test
        run: |
          # Generate test certificates
          ./scripts/generate-root-ca.sh ./test-certs
          
          # Set minimal environment
          cat > .env << EOF
          POSTGRES_PASSWORD=test-password
          GOOGLE_CLIENT_ID=test-client-id.apps.googleusercontent.com
          AUTHZ_ROOT_CA_CERT=./test-certs/keep-root.pem
          AUTHZ_ROOT_CA_KEY=./test-certs/keep-root-key.pem
          EOF
          
          # Start services briefly to test startup
          timeout 30s docker compose -f docker-compose.secure.yml up --abort-on-container-exit || true
