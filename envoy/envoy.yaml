static_resources:
  listeners:
    - name: listener_https
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                forward_client_cert_details: sanitize_set
                set_current_client_cert_details:
                  subject: true
                  cert: true
                  dns: true
                  uri: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: flask_service
                            upgrade_configs:
                              - upgrade_type: websocket
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          -- Extract and normalize device ID from multiple sources
                          local device_id = nil
                          
                          -- Priority 1: X-Device-ID header (explicit)
                          device_id = request_handle:headers():get("x-device-id")
                          
                          -- Priority 2: Tailscale node ID from client cert CN
                          if not device_id or device_id == "" then
                            local xfcc = request_handle:headers():get("x-forwarded-client-cert")
                            if xfcc then
                              -- Parse subject from XFCC header: Subject="CN=tailscale:abc123"
                              local subject = string.match(xfcc, 'Subject="([^"]*)"')
                              if subject then
                                local cn = string.match(subject, "CN=([^,]*)")
                                if cn and string.match(cn, "^tailscale:") then
                                  device_id = cn
                                end
                              end
                            end
                          end
                          
                          -- Priority 3: device_id query parameter
                          if not device_id or device_id == "" then
                            local path = request_handle:headers():get(":path")
                            if path then
                              device_id = string.match(path, "[?&]device_id=([^&]*)")
                            end
                          end
                          
                          -- Set normalized device ID header (or "unknown" if not found)
                          if device_id and device_id ~= "" then
                            request_handle:headers():replace("x-device-id", device_id)
                          else
                            request_handle:headers():replace("x-device-id", "unknown")
                          end
                          
                          -- Check if this is an MFA verification callback
                          local path = request_handle:headers():get(":path")
                          if path and string.match(path, "^/auth/mfa/callback") then
                            -- Handle MFA callback
                            local query_params = {}
                            local query = string.match(path, "^[^?]*?(.*)$")
                            if query then
                              for key, value in string.gmatch(query, "([^&=]+)=([^&]*)") do
                                query_params[key] = value
                              end
                            end
                            
                            if query_params.session and query_params.code then
                              -- Add MFA verification headers
                              request_handle:headers():add("x-mfa-session", query_params.session)
                              request_handle:headers():add("x-mfa-code", query_params.code)
                              request_handle:headers():replace(":path", "/auth/mfa/verify-envoy")
                            end
                          end
                        end

                        function envoy_on_response(response_handle)
                          local status = response_handle:headers():get(":status")
                          local content_type = response_handle:headers():get("content-type")
                          
                          -- Intercept 403 responses with JSON content (step-up required)
                          if status == "403" and content_type and string.match(content_type, "application/json") then
                            local body = response_handle:body()
                            if body then
                              local body_str = body:getBytes(0, body:length())
                              -- Simple check for MFA required
                              if string.match(body_str, "mfa_required") then
                                -- Extract session ID from response (basic parsing)
                                local session_id = string.match(body_str, '"session_id"%s*:%s*"([^"]*)"') or ""
                                
                                -- Create MFA challenge page
                                local mfa_html = [[
<!DOCTYPE html>
<html>
<head><title>Additional Authentication Required</title></head>
<body style="font-family: Arial, sans-serif; max-width: 400px; margin: 100px auto; padding: 20px;">
    <h2>Additional Authentication Required</h2>
    <p>Your device security posture requires additional verification.</p>
    <form method="GET" action="/auth/mfa/callback">
        <input type="hidden" name="session" value="]] .. session_id .. [[">
        <p>Enter the 6-digit code from your authenticator:</p>
        <input type="text" name="code" placeholder="123456" maxlength="6" required 
               style="width: 100%; padding: 10px; font-size: 18px; text-align: center;">
        <br><br>
        <button type="submit" style="width: 100%; padding: 15px; background: #007cba; color: white; border: none;">
            Verify
        </button>
    </form>
</body>
</html>]]
                                
                                response_handle:headers():remove("content-length")
                                response_handle:headers():replace("content-type", "text/html")
                                response_handle:headers():replace(":status", "200")
                                response_handle:body():setBytes(mfa_html)
                              end
                            end
                          end
                        end
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      include_peer_certificate: true
                      http_service:
                        server_uri:
                          uri: http://authz:8443
                          cluster: authz_http
                          timeout: 0.5s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-device-id
                              - exact: x-forwarded-for
                              - exact: x-forwarded-proto
                              - exact: x-request-id
                              - exact: x-forwarded-client-cert
                              - exact: x-envoy-external-address
                              - exact: x-real-ip
                              - exact: x-mfa-session
                              - exact: x-mfa-code
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-device-id
                              - exact: x-client-subject
                              - exact: x-user-email
                              - exact: x-user-name
                              - exact: x-user-groups
                              - exact: x-device-hostname
                              - exact: x-device-trust-score
                              - exact: x-device-compliant
                          allowed_client_headers:
                            patterns:
                              - exact: authorization
                              - exact: x-auth-error
                              - exact: x-auth-decision
                  - name: envoy.filters.http.router
  clusters:
    - name: flask_service
      connect_timeout: 1s
      type: logical_dns
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: flask_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: app
                      port_value: 5000
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          common_tls_context:
            tls_certificates:
              - certificate_chain:
                  filename: /etc/envoy/certs/client.pem
                private_key:
                  filename: /etc/envoy/certs/client.key
            validation_context:
              trusted_ca:
                filename: /etc/envoy/certs/ca.pem
    - name: authz_http
      connect_timeout: 0.5s
      type: logical_dns
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: authz_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authz
                      port_value: 8443
    - name: mfa_cluster
      connect_timeout: 0.5s
      type: logical_dns
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mfa_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mfa
                      port_value: 8445
admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 8001
